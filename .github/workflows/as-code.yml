name: As-Code Dashboards

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  OCI_IMAGE: ghcr.io/duynhlab/grafana-dashboards-as-code
  GO_VERSION: "1.26"
  FLUX_VERSION: "2.6.0"
  KIND_VERSION: "v0.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify formatting
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

      - name: Vet and test with coverage
        run: |
          go vet ./...
          go test ./... -coverpkg=./... -coverprofile=/tmp/coverage.out
          TOTAL="$(go tool cover -func=/tmp/coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')"
          echo "total coverage: ${TOTAL}% (required: 90.0%)"
          awk -v actual="${TOTAL}" 'BEGIN { if ((actual + 0) < 90.0) exit 1 }'

      - name: Generate dashboards
        run: go run ./cmd/generate

      - name: Check generated diff
        run: |
          git diff --exit-code -- generated/ deploy/

      - name: Kustomize build
        run: |
          # Each wave must render on its own: a consumer points one Flux
          # Kustomization at deploy/folders and the next at deploy/dashboards.
          for overlay in deploy deploy/folders deploy/dashboards; do
            kubectl kustomize "${overlay}" > "/tmp/rendered-$(basename "${overlay}").yaml"
          done
          grep -q "kind: GrafanaManifest" /tmp/rendered-deploy.yaml
          grep -q "kind: GrafanaAlertRuleGroup" /tmp/rendered-deploy.yaml
          grep -q "apiVersion: folder.grafana.app/v1" /tmp/rendered-folders.yaml
          grep -q "apiVersion: dashboard.grafana.app/v2" /tmp/rendered-dashboards.yaml
          # GrafanaDashboard cannot carry a v2 payload; Grafana answers 400.
          if grep -q "kind: GrafanaDashboard" /tmp/rendered-deploy.yaml; then
            echo "deploy/ still emits GrafanaDashboard, which cannot carry a v2 board" >&2
            exit 1
          fi

      - name: Every generated dashboard has a CR
        run: |
          specs="$(find generated/dashboards -name '*.spec.json' | wc -l)"
          crs="$(ls deploy/dashboards/grafanamanifest-*.yaml | wc -l)"
          echo "spec files: ${specs}, GrafanaManifest CRs: ${crs}"
          test "${specs}" -eq "${crs}"

  publish-oci:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate dashboards
        run: go run ./cmd/generate

      - name: Install Flux CLI
        run: |
          curl -fsSL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv flux /usr/local/bin/flux
          flux version --client

      - name: Push the deploy bundle
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the deploy bundle ships. GrafanaManifest has no content sources
          # at all, so nothing would ever pull a separate dashboard-JSON
          # artifact: Flux pulls this bundle once per interval and applies it.
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            EXTRA_TAG="${GITHUB_REF_NAME}"
          else
            EXTRA_TAG="sha-${SHORT_SHA}"
          fi
          flux push artifact "oci://${OCI_IMAGE}:latest" \
            --path="./deploy" \
            --source="$(git config --get remote.origin.url)" \
            --revision="${GITHUB_REF_NAME}@sha1:${{ github.sha }}" \
            --reproducible \
            --creds="${GHCR_USER}:${GHCR_TOKEN}"
          flux tag artifact "oci://${OCI_IMAGE}:latest" \
            --tag "${EXTRA_TAG}" \
            --creds="${GHCR_USER}:${GHCR_TOKEN}"

  e2e-kind:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate dashboards
        run: go run ./cmd/generate

      - name: Install Kind
        run: |
          curl -fsSL -o /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: E2E on Kind 1.36
        run: ./test/e2e/kind/run.sh
